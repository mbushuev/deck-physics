name: Build installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      sources: ${{ steps.package.outputs.sources }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the installer and corresponding sources
        id: package
        run: |
          archive=$(python3 Build-DeckPhysX.py)
          sources=$(python3 Build-DeckPhysX.py --sources-only)
          sha256sum "$archive" > "$archive.sha256"
          sha256sum "$sources" > "$sources.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeckPhysX-Proton11
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Upload corresponding sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeckPhysX-Proton11-sources
          path: |
            ${{ steps.package.outputs.sources }}
            ${{ steps.package.outputs.sources }}.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify the version tag and main ancestry
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DeckPhysX-Proton11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DeckPhysX-Proton11-sources
      - name: Publish the tagged installer
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
          SOURCES: ${{ needs.build.outputs.sources }}
        run: |
          sha256sum --check "$ARCHIVE.sha256"
          sha256sum --check "$SOURCES.sha256"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "$ARCHIVE" "$ARCHIVE.sha256" "$SOURCES" "$SOURCES.sha256"
