name: Build installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the installer from pinned inputs
        run: python3 Build-DeckPhysX.py
      - name: Record installer checksum
        run: sha256sum DeckPhysX-Proton11.tar.gz > DeckPhysX-Proton11.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeckPhysX-Proton11
          path: |
            DeckPhysX-Proton11.tar.gz
            DeckPhysX-Proton11.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify the tag points to a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DeckPhysX-Proton11
      - name: Publish the tagged installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check DeckPhysX-Proton11.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            DeckPhysX-Proton11.tar.gz DeckPhysX-Proton11.tar.gz.sha256
