name: Check sources

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Python, shell, and native sources
        run: |
          python3 -m py_compile Build-DeckPhysX.py Install-DeckPhysX.py PatchDialog.py PatchPackages.py runtime/*.py
          bash -n Install.sh
          bash -n run
          cc -std=gnu11 -Wall -Wextra -fsyntax-only native/hip-wait-startup.c
      - name: Test game patch packages
        run: python3 -m unittest discover -s tests
